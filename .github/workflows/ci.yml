name: CI
on: [push, pull_request]
jobs:
  check:
    # Versão fixa: o ubuntu-latest migrou para o 26.04 (out/2026), sem Chromium no Playwright 1.56.1 (CI do P21).
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16.4-alpine
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: sansol_test }
        ports: ["5432:5432"]
        # -d: sem ele o pg_isready conecta ao banco "ci" (nome do usuário), inexistente — FATAL a cada 5 s no log.
        options: --health-cmd "pg_isready -U ci -d sansol_test" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/sansol_ci_unused
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/sansol_test
      APP_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.19.0, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Desde o P19: 0 vulnerabilidades (produção e desenvolvimento). Produção sem tolerância; desenvolvimento a partir de moderada.
      - run: npm audit --omit=dev
      - run: npm audit --audit-level=moderate
      - run: npm run build
      # E2E de navegador: banco temporário próprio no mesmo Postgres de teste, build de produção (.next-e2e)
      # servido como na imagem (node server.js) e gateway SIMULADO. Nenhum gateway real.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:build
      - run: npm run e2e:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
  # Imagens Docker (P20): aplicação e migração do mesmo commit. A aplicação precisa subir SEM migrar (503
  # migrations_pending); a migração é um passo explícito; depois o health responde 200.
  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: sansol_docker }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ci -d sansol_docker" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/sansol_docker
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target migrate -t wemob-migrate:ci .
      - run: docker build -t wemob-app:ci .
      - name: Aplicação sobe sem migrar (503 migrations_pending)
        run: |
          docker run -d --name app --network host -e DATABASE_URL -e APP_SECRET=ci-only-secret -e PORT=3000 -e HOSTNAME=127.0.0.1 wemob-app:ci
          code=000
          for i in $(seq 1 30); do code=$(curl -s -o body.json -w '%{http_code}' http://127.0.0.1:3000/api/health || true); [ "$code" != "000" ] && break; sleep 1; done
          cat body.json; test "$code" = "503"; grep -q migrations_pending body.json
      - run: docker run --rm --network host -e DATABASE_URL wemob-migrate:ci
      - run: docker run --rm --network host -e DATABASE_URL wemob-migrate:ci node node_modules/prisma/build/index.js migrate status
      - name: Aplicação após a migração (200)
        run: |
          code=$(curl -s -o body.json -w '%{http_code}' http://127.0.0.1:3000/api/health); cat body.json; test "$code" = "200"
      - if: always()
        run: docker logs app || true
