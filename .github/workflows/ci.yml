name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env: { POSTGRES_USER: ci, POSTGRES_PASSWORD: ci, POSTGRES_DB: sansol_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U ci" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/sansol_ci_unused
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/sansol_test
      APP_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22.19.0, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Altas conhecidas exigem upgrades major (Next 16, Prisma 7, Zod 4) — ver IMPLEMENTATION_STATUS.md.
      - run: npm audit --omit=dev --audit-level=critical
      - run: npm run build
      # E2E de navegador: banco temporário próprio no mesmo Postgres de teste, build de produção (.next-e2e)
      # servido como na imagem (node server.js) e gateway SIMULADO. Nenhum gateway real.
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:build
      - run: npm run e2e:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
