# Ambiente local reproduzível: Postgres + aplicação.
# Uso: cp .env.example .env (ajuste) && docker compose up --build
services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: sansol
      POSTGRES_PASSWORD: sansol-dev-only
      POSTGRES_DB: sansol_dev
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sansol -d sansol_dev"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://sansol:sansol-dev-only@db:5432/sansol_dev
      APP_SECRET: ${APP_SECRET:?defina APP_SECRET no .env}
      NODE_ENV: production
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
volumes:
  pgdata:
