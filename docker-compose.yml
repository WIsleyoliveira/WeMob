# Ambiente local reproduzível: Postgres + aplicação.
# Uso: cp .env.example .env (ajuste), depois:
#   docker compose up -d db
#   docker compose --profile migrate run --rm migrate   # etapa explícita: aplica as migrações uma única vez
#   docker compose up --build -d app ocpp
# A aplicação não migra o banco ao iniciar (ver Dockerfile e docs/runbook.md).
services:
  db:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: sansol
      POSTGRES_PASSWORD: sansol-dev-only
      POSTGRES_DB: sansol_dev
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sansol -d sansol_dev"]
      interval: 5s
      retries: 10
  migrate:
    # Execução única e explícita de `prisma migrate deploy` (não sobe com `docker compose up`).
    profiles: ["migrate"]
    # Alvo "migrate" do Dockerfile: a imagem final da aplicação não contém o CLI completo do Prisma.
    build: { context: ., target: migrate }
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://sansol:sansol-dev-only@db:5432/sansol_dev
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    restart: "no"
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://sansol:sansol-dev-only@db:5432/sansol_dev
      APP_SECRET: ${APP_SECRET:?defina APP_SECRET no .env}
      NODE_ENV: production
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
  ocpp:
    # Usa o estágio "build" (código-fonte + dependências): o estágio final contém só o servidor web.
    build: { context: ., target: build }
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://sansol:sansol-dev-only@db:5432/sansol_dev
      APP_SECRET: ${APP_SECRET:?defina APP_SECRET no .env}
      OCPP_PORT: "9220"
      OCPP_ALLOW_PRODUCTION_COMMANDS: "0"
    # Servidor OCPP 1.6-J. Em produção, publique atrás de proxy com TLS (wss://).
    command: ["npx", "tsx", "scripts/ocpp-server.ts"]
    ports: ["9220:9220"]
volumes:
  pgdata:
